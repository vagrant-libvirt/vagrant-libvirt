# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest
    env:
      VAGRANT_LIBVIRT_REQUIRE_SIMPLECOV: "true"
    continue-on-error: ${{ matrix.allow_fail }}
    strategy:
      fail-fast: false
      matrix:
        # need to define one entry with a single entry for each of the options
        # to allow include to expand the matrix correctly.
        ruby: ['3.4']
        vagrant: [main]
        allow_fail: [true]
        include:
          # oldest ruby still shipped by a supported distribution (Debian 12).
          # The vagrant releases those distributions package cannot be tested
          # here any more: 2.3.4 fails on google-protobuf having dropped the
          # DescriptorPool#build API its generated code uses, and 2.3.7 on
          # ruby 3.2, see below.
          - ruby: '3.1'
            vagrant: v2.4.9
            allow_fail: false
          # ruby 3.2 is skipped because vagrant pins ed25519 to ~> 1.3.0 and
          # 1.3.0 does not compile against the ruby 3.2 headers with the
          # compiler on ubuntu-26.04
          - ruby: '3.3'
            vagrant: v2.4.9
            allow_fail: false
          - ruby: '3.4'
            vagrant: v2.4.9
            allow_fail: false
          # ruby 4.0 is only accepted by vagrant main (>= 3.3, < 4.1) so far
          - ruby: '4.0'
            vagrant: main
            allow_fail: true

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up libvirt
      run: |
        sudo apt-get update
        sudo apt-get install libvirt-dev
    - name: Ensure bundle uses https instead of insecure git
      run: |
        git config --global url."https://github.com/".insteadOf git://github.com/
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        # bundler 2.6 up to 4.0.23 does not apply the enclosing group block to
        # `gemspec` (ruby/rubygems#9990), which drops this plugin out of the
        # :plugins group and stops vagrant from loading it. The fix only exists
        # in bundler 4, which in turn needs ruby 3.2, so the older ruby keeps
        # the bundler it ships with, which predates the regression.
        bundler: ${{ matrix.ruby == '3.1' && 'default' || '4' }}
      env:
        # skip installing development group gems to save time
        BUNDLE_WITHOUT: 'development'
        BUNDLE_JOBS: 4
        VAGRANT_VERSION: ${{ matrix.vagrant }}
    - name: Run tests
      run: |
        bundle exec parallel_test spec --type rspec
      env:
        BUNDLE_WITHOUT: 'development'
        VAGRANT_VERSION: ${{ matrix.vagrant }}
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        parallel: true
        path-to-lcov: ./coverage/lcov.info

  finish:
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Check matrix execution status
      run: exit 1
      # see https://stackoverflow.com/a/67532120/4907315
      # and https://github.com/orgs/community/discussions/26822
      if: >-
        ${{
             contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        }}
    - name: Coveralls Finished
      uses: coverallsapp/github-action@master
      if: contains(needs.*.result, 'skipped') == false
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
